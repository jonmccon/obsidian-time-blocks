name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"

            - run: npm ci
            - run: npm run build

            - name: Collect attestation subjects
              id: attest-subjects
              run: |
                  files="main.js
                  manifest.json"
                  if [ -f styles.css ]; then
                    files="$files
                  styles.css"
                  fi
                  {
                    echo "subject-path<<EOF"
                    echo "$files"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: ${{ steps.attest-subjects.outputs.subject-path }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  assets=(main.js manifest.json)
                  if [ -f styles.css ]; then
                    assets+=(styles.css)
                  fi

                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    "${assets[@]}"
